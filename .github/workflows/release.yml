# Builds Tropix for MPC in GitHub Actions and attaches Tropix-<version>-mpc-armv7.zip to a DRAFT release.
# Actions -> Release -> Run workflow, enter the version. Install that zip on an MPC, check it, then publish the draft.
# Release notes: write docs/releases/v<version>.md first -- what changed and what was fixed since the last release (not
# install steps; those are in INSTALL.md inside the zip). The draft's notes are that file.
# mpc-vst-plugins is pinned in both places below: the workflow and its tools (6a60288: notes from docs/releases, vst.json skin_compact).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.1.0
        required: true
        type: string
      dry_run:
        description: Build and package only (zip as a run artifact), no draft release
        type: boolean
        default: false

jobs:
  vst:
    uses: 3dthc/mpc-vst-plugins/.github/workflows/vst-release.yml@bee650d7d6444f972933d991ded3b9e095e169a7
    permissions: { contents: write }
    with:
      tag: v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: bee650d7d6444f972933d991ded3b9e095e169a7
      user_data: user          # the shared favourites (user/favorites.txt): an upgrade keeps them
      vst_dir: vst
      build: bash tools/ci_build.sh
      host_test: 'mkdir -p vst/build/engine && cp engine/* vst/build/engine/ && "$MPC_VST/tools/test_port.sh" vst/vst.json'
      extra: engine:engine
      about: Island and afro sounds - 128 presets and 65 instruments for afrobeat, amapiano, kompa, soca, reggae and Hawaiian music. Two layers, glide, scoop, vibrato, filter, drive, chorus, delay, reverb, nine colorways.
      plugin_id: tropix
      license: MIT
      dry_run: ${{ inputs.dry_run }}
      desktop: true
      desktop_data: engine
